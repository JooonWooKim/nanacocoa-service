name: PR Description

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 갱신할 pull request 번호
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-description-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  update-description:
    name: Update PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target의 쓰기 토큰으로 신뢰되지 않은 PR head를 checkout하지 않는다.
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test description generator
        run: node --test .github/scripts/pr-description.test.mjs

      - name: Update pull request description
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node .github/scripts/pr-description.mjs
