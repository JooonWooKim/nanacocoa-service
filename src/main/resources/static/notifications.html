<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문 알림 | nanacocoa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="inventory-page" data-order-notifications="member">
  <nav aria-label="알림 메뉴"><a href="orders.html">내 주문</a> · <a href="index.html">홈</a></nav>
  <h1>주문 알림</h1>
  <p role="status" data-notification-status>알림을 불러오는 중입니다.</p>
  <a data-notification-login hidden href="login.html?return=notifications">로그인</a>
  <section data-notification-panel hidden>
    <p data-notification-unread></p>
    <ul data-notification-list></ul>
    <button type="button" data-notification-prev disabled>이전</button>
    <button type="button" data-notification-next disabled>다음</button>
  </section>
  <button type="button" data-notification-refresh>다시 조회</button>
</main>
<script src="script.js"></script>
<script src="order-notifications.js"></script>
</body>
</html>
