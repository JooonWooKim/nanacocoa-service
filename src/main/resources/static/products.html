    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="상단 메뉴">
      <button class="icon-button menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="side-menu">
        <span class="menu-line"></span>
        <span class="menu-line"></span>
      </button>

      <a class="brand" href="index.html" aria-label="nanacocoa 홈">
        <img src="IMG_1483.JPG" alt="nanacocoa" />
      </a>

      <nav class="quick-actions" aria-label="빠른 메뉴">
        <a class="icon-button" href="#product-search" aria-label="검색">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m16.5 16.5 4 4"></path>
          </svg>
        </a>
        <a class="icon-button cart-link" href="#product-list" aria-label="장바구니">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 8.5h11l1 11h-13l1-11Z"></path>
            <path d="M9 8.5a3 3 0 0 1 6 0"></path>
          </svg>
          <span class="cart-dot" aria-hidden="true">0</span>

        <div class="drawer-group is-open">
          <button type="button" class="drawer-trigger" aria-expanded="true">
            <span>About</span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <div class="drawer-panel">
            <a href="index.html#about">nanacocoa story</a>
          </div>
        </div>

        <div class="drawer-group is-open">
          <button type="button" class="drawer-trigger" aria-expanded="true">
            <span>Shop</span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <div class="drawer-panel">
            <a href="products.html" aria-current="page">All</a>
            <a href="products.html">New In</a>
            <a href="products.html?category=2" hidden data-discovery-category="2">Tableware</a>
            <a href="products.html?category=1" hidden data-discovery-category="1">Mugs</a>
            <a href="index.html#shop">Ritual</a>

    <button class="menu-scrim" type="button" aria-label="메뉴 닫기" hidden></button>

    <main class="products-page" id="top" data-products-page>
      <section class="products-section" id="product-list" aria-labelledby="products-title">
        <h1 id="products-title">상품 목록</h1>
        <form id="product-search" class="products-toolbar" action="products.html" method="get" data-discovery-form>
          <label>상품명 <input type="search" name="q" maxlength="100"></label>
          <label>카테고리 <select name="category"><option value="">전체</option></select></label>
          <button type="submit">검색</button>
        </form>
        <p class="product-total" data-discovery-count hidden>검색 결과 <strong data-products-total></strong>개</p>
        <p role="status" aria-live="polite" data-discovery-state></p>
        <button type="button" data-discovery-retry hidden>다시 시도</button>
        <button type="button" data-discovery-recover hidden></button>

        <div class="products-grid" aria-label="제품 목록" data-products-grid></div>
        <nav class="products-toolbar" aria-label="상품 목록 페이지" data-discovery-pagination hidden>
          <button type="button" data-page-previous>이전</button>
          <span data-page-position></span>
          <button type="button" data-page-next>다음</button>
        </nav>
      </section>
