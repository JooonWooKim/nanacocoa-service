<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>비밀번호 찾기 · 나나코코아</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="password-recovery.js" defer></script>
  </head>
  <body class="login-body">
    <main class="login-page" data-recovery-kind="request">
      <section class="login-content" aria-labelledby="recovery-title">
        <a href="login.html">로그인으로 돌아가기</a>
        <h1 id="recovery-title">비밀번호 찾기</h1>
        <p id="email-help">아이디는 가입 이메일입니다. 가입 이메일로 비밀번호 복구를 요청해주세요.</p>
        <form class="login-form" data-recovery-form>
          <label class="login-field">가입 이메일
            <input class="login-input" name="email" type="email" autocomplete="email" maxlength="255" required />
          </label>
          <button class="login-submit" type="submit">복구 안내 요청</button>
        </form>
        <p class="login-message" role="status" aria-live="polite" data-recovery-message></p>
      </section>
    </main>
  </body>
</html>
