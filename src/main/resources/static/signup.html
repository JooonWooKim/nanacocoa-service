<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원가입 | nanacocoa</title>
    <meta
      name="description"
      content="nanacocoa 회원가입 페이지"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-body">
    <main class="login-page" aria-labelledby="signup-title">
      <header class="login-topbar" aria-label="회원가입 상단 메뉴">
        <button class="login-nav-button" type="button" aria-label="이전 페이지" onclick="history.back()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18 9 12l6-6"></path>
            <path d="M10 12h11"></path>
          </svg>
        </button>
        <a class="login-nav-button" href="index.html" aria-label="홈으로 이동">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 11 9-8 9 8"></path>
            <path d="M5 10v10h5v-6h4v6h5V10"></path>
          </svg>
        </a>
      </header>

      <section class="login-content">
        <div class="login-heading">
          <h1 id="signup-title">회원가입</h1>
          <p>
            이메일과 비밀번호, 이름만 입력하면<br />
            nanacocoa를 바로 시작할 수 있어요.
          </p>
        </div>

        <form class="login-form signup-form" action="/api/auth/signup" method="post" data-signup-form>
          <label class="login-field">
            <span class="visually-hidden">이메일</span>
            <input
              class="login-input"
              type="email"
              name="email"
              autocomplete="email"
              placeholder="이메일"
              required
            />
          </label>

          <label class="login-field">
            <span class="visually-hidden">비밀번호</span>
            <input
              class="login-input"
              type="password"
              name="password"
              autocomplete="new-password"
              placeholder="비밀번호"
              minlength="8"
              maxlength="72"
              required
            />
          </label>

          <label class="login-field">
            <span class="visually-hidden">이름</span>
            <input
              class="login-input"
              type="text"
              name="name"
              autocomplete="name"
              placeholder="이름"
              maxlength="50"
              required
            />
          </label>

          <p class="login-message" role="alert" aria-live="polite" hidden></p>

          <button class="login-submit" type="submit">회원가입</button>
        </form>

        <nav class="login-links" aria-label="계정 메뉴">
          <a href="login.html">이미 계정이 있으신가요?</a>
        </nav>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
