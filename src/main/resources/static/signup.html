<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원가입 | nanacocoa</title>
    <meta
      name="description"
      content="nanacocoa 회원가입 페이지"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-body">
    <main class="login-page" aria-labelledby="signup-title">
      <header class="login-topbar" aria-label="회원가입 상단 메뉴">
        <button class="login-nav-button" type="button" aria-label="이전 페이지" onclick="history.back()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18 9 12l6-6"></path>
            <path d="M10 12h11"></path>
          </svg>
        </button>
        <a class="login-nav-button" href="index.html" aria-label="홈으로 이동">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 11 9-8 9 8"></path>
            <path d="M5 10v10h5v-6h4v6h5V10"></path>
          </svg>
        </a>
      </header>

      <section class="login-content">
        <div class="login-heading">
          <h1 id="signup-title">회원가입</h1>
          <p>
            가입 정보와 서비스 정책을 확인하고<br />
            nanacocoa를 시작해 주세요.
          </p>
        </div>

        <form class="login-form signup-form" action="/api/auth/signup" method="post" data-signup-form>
          <label class="login-field">
            <span class="visually-hidden">이메일</span>
            <input
              class="login-input"
              type="email"
              name="email"
              autocomplete="email"
              placeholder="이메일"
              required
            />
          </label>

          <label class="login-field">
            <span class="visually-hidden">비밀번호</span>
            <input
              class="login-input"
              type="password"
              name="password"
              autocomplete="new-password"
              placeholder="비밀번호"
              minlength="8"
              maxlength="72"
              required
            />
          </label>

          <label class="login-field">
            <span class="visually-hidden">이름</span>
            <input
              class="login-input"
              type="text"
              name="name"
              autocomplete="name"
              placeholder="이름"
              maxlength="50"
              required
            />
          </label>

          <label class="login-field">
            <span class="visually-hidden">주소</span>
            <textarea
              class="login-input signup-address"
              name="address"
              autocomplete="street-address"
              placeholder="주소"
              maxlength="500"
              rows="3"
              required
            ></textarea>
          </label>

          <label class="login-field">
            <span class="visually-hidden">전화번호</span>
            <input
              class="login-input"
              type="tel"
              name="phoneNumber"
              autocomplete="tel"
              placeholder="전화번호 (010-0000-0000)"
              pattern="010-[0-9]{4}-[0-9]{4}"
              maxlength="13"
              required
            />
          </label>

          <fieldset class="signup-consent" data-policy-choices>
            <legend>이메일 수신여부</legend>
            <label>
              <input type="radio" name="emailReceiveConsent" value="Y" required />
              <span>수신</span>
            </label>
            <label>
              <input type="radio" name="emailReceiveConsent" value="N" checked required />
              <span>수신 거부</span>
            </label>
          </fieldset>

          <section aria-label="서비스 정책과 가입 동의">
            <div data-signup-policies></div>
            <p role="status" aria-live="polite" data-policy-status>서비스 정책을 확인하고 있습니다.</p>
            <button type="button" data-policy-retry>정책 다시 조회</button>
          </section>

          <p class="login-message" role="alert" aria-live="polite" hidden></p>

          <button class="login-submit" type="submit" disabled>회원가입</button>
        </form>

        <nav class="login-links" aria-label="계정 메뉴">
          <a href="login.html">이미 계정이 있으신가요?</a>
        </nav>
      </section>
    </main>
    <script src="policies.js"></script>
    <script src="script.js"></script>
  </body>
</html>
