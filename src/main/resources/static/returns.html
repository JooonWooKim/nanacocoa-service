<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>취소·반품 운영 · 나나코코아</title><link rel="stylesheet" href="styles.css"></head>
<body class="mypage-body"><main class="mypage-page" data-return-admin>

<form class="inventory-card">

<p data-return-message role="status" aria-live="polite"></p>
<button type="button" data-return-retry>최신 상태 조회</button>
