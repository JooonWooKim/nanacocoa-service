<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>비밀번호 재설정 · 나나코코아</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="password-recovery.js" defer></script>
  </head>
  <body class="login-body">
    <main class="login-page" data-recovery-kind="reset">
      <section class="login-content" aria-labelledby="recovery-title">
        <h1 id="recovery-title">비밀번호 재설정</h1>
        <p>새 비밀번호를 설정하면 모든 기기의 기존 로그인이 만료됩니다.</p>
        <form class="login-form" data-recovery-form>
          <label class="login-field">새 비밀번호
            <input class="login-input" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required />
          </label>
          <label class="login-field">새 비밀번호 확인
            <input class="login-input" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" maxlength="72" required />
          </label>
          <p>8~72자이며 UTF-8 기준 72바이트 이내로 입력해주세요.</p>
          <button class="login-submit" type="submit">비밀번호 변경</button>
        </form>
        <p class="login-message" role="status" aria-live="polite" data-recovery-message></p>
        <nav class="login-links" aria-label="복구 메뉴">
          <a href="login.html">로그인하기</a>
          <a href="password-recovery.html">복구 안내 다시 요청</a>
        </nav>
      </section>
    </main>
  </body>
</html>
