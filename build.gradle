plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nanacocoa'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.46.5')
	implementation 'software.amazon.awssdk:s3'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation('org.redisson:redisson-spring-boot-starter:4.6.1') {
        exclude group: 'org.redisson', module: 'redisson-spring-data-40'
    }
    implementation 'org.redisson:redisson-spring-data-35:4.6.1'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.projectlombok:lombok:1.18.22'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('mysqlQualityTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    outputs.upToDateWhen { false }
    outputs.doNotCacheIf('uses a disposable MySQL database') { true }

    def reportDirectory = providers.environmentVariable('MYSQL_QUALITY_XML_DIR')
    reports.junitXml.outputLocation.set(layout.projectDirectory.dir(reportDirectory.orElse('build/test-results/mysqlQualityTest').get()))
    reports.html.required.set(false)

    filter {
        includeTestsMatching 'com.nanacocoa.server.migration.FlywayMigrationTest'
        includeTestsMatching 'com.nanacocoa.server.migration.FilePolicyConsentMigrationTest'
        includeTestsMatching 'com.nanacocoa.server.order.inventory.InventoryIntegrationTest'
        includeTestsMatching 'com.nanacocoa.server.order.inventory.PaymentOperationsIntegrationTest'
        includeTestsMatching 'com.nanacocoa.server.order.inventory.ReturnRequestIntegrationTest'
    }
    doFirst {
        def keys = ['SUBMISSION_MIGRATION_TEST_DB_URL', 'POLICY_FILE_MIGRATION_DB_URL', 'INVENTORY_TEST_DB_URL',
                    'PAYMENT_OPERATIONS_TEST_DB_URL', 'RETURNS_TEST_DB_URL']
        def urls = keys.collect { environment[it] }
        def localMysql = ~/jdbc:mysql:\/\/127\.0\.0\.1:[1-9][0-9]{0,4}\/[a-z_]+(?:\?.*)?/
        if (!reportDirectory.isPresent() || !urls.every { it != null && it ==~ localMysql }) {
            throw new GradleException('mysqlQualityTest requires isolated MySQL configuration from the harness.')
        }
    }
}

// 운영 jar에는 포함되지 않는 loopback 브라우저 검증 서버.
tasks.register('commerceE2e', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.nanacocoa.server.e2e.CommerceE2eServer'
}

// 합성 회원·메모리 수신함만 사용하는 loopback 복구 검증 서버.
tasks.register('recoveryE2e', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.nanacocoa.server.e2e.RecoveryE2eServer'
}
